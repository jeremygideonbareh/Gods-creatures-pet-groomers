table:
  schema: public
  name: bookings
object_relationships:
  - name: pet
    using:
      foreign_key_constraint_on: pet_id
  - name: user
    using:
      foreign_key_constraint_on: user_id
array_relationships: []
insert_permissions:
  - role: user
    permission:
      check:
        user_id:
          _eq: X-Hasura-User-Id
      set:
        user_id: x-hasura-User-Id
      columns:
        - addons
        - advance_paid
        - customer_name
        - email
        - notes
        - pet_id
        - phone
        - preferred_date
        - service
        - total_price
        - transaction_id
      backend_only: false
  - role: admin
    permission:
      check:
        user_id:
          _eq: X-Hasura-User-Id
      set:
        user_id: x-hasura-User-Id
      columns:
        - addons
        - advance_paid
        - customer_name
        - email
        - notes
        - pet_id
        - phone
        - preferred_date
        - service
        - total_price
        - transaction_id
      backend_only: false
select_permissions:
  - role: user
    permission:
      columns:
        - addons
        - advance_paid
        - created_at
        - customer_name
        - email
        - id
        - notes
        - pet_id
        - phone
        - preferred_date
        - service
        - status
        - total_price
        - transaction_id
        - user_id
      filter:
        user_id:
          _eq: X-Hasura-User-Id
      allow_aggregations: true
  - role: admin
    permission:
      columns:
        - addons
        - advance_paid
        - created_at
        - customer_name
        - email
        - id
        - notes
        - pet_id
        - phone
        - preferred_date
        - service
        - status
        - total_price
        - transaction_id
        - user_id
      filter: {}
      allow_aggregations: true
update_permissions:
  - role: admin
    permission:
      columns:
        - advance_paid
        - notes
        - status
        - transaction_id
      filter: {}
      check: null
      set:
        user_id: x-hasura-User-Id
delete_permissions: []
