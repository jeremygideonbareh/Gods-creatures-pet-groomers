table:
  name: bookings
  schema: public
object_relationships:
  - name: pet
    using:
      foreign_key_constraint_on: pet_id
insert_permissions:
  - role: user
    permission:
      check:
        user_id:
          _eq: X-Hasura-User-Id
      set:
        user_id: x-hasura-User-Id
      columns:
        - addons
        - advance_paid
        - customer_name
        - email
        - notes
        - pet_id
        - phone
        - preferred_date
        - service
        - status
        - total_price
        - transaction_id
select_permissions:
  - role: user
    permission:
      columns:
        - addons
        - advance_paid
        - created_at
        - customer_name
        - email
        - id
        - notes
        - pet_id
        - phone
        - preferred_date
        - service
        - status
        - total_price
        - transaction_id
        - user_id
      filter:
        user_id:
          _eq: X-Hasura-User-Id
      allow_aggregations: true

