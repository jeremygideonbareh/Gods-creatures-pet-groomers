table:
  name: users
  schema: auth
configuration:
  column_config:
    avatar_url:
      custom_name: avatarUrl
    created_at:
      custom_name: createdAt
    default_role:
      custom_name: defaultRole
    display_name:
      custom_name: displayName
    email_verified:
      custom_name: emailVerified
    is_anonymous:
      custom_name: isAnonymous
    last_seen:
      custom_name: lastSeen
    locale:
      custom_name: locale
    new_email:
      custom_name: newEmail
    phone_number:
      custom_name: phoneNumber
    phone_number_verified:
      custom_name: phoneNumberVerified
  custom_column_names:
    avatar_url: avatarUrl
    created_at: createdAt
    default_role: defaultRole
    display_name: displayName
    email_verified: emailVerified
    is_anonymous: isAnonymous
    last_seen: lastSeen
    locale: locale
    new_email: newEmail
    phone_number: phoneNumber
    phone_number_verified: phoneNumberVerified
  custom_name: users
  custom_root_fields:
    delete_by_pk: deleteUser
    insert: insertUsers
    insert_one: insertUser
    select: users
    select_aggregate: usersAggregate
    select_by_pk: user
    update_by_pk: updateUser
object_relationships:
  - name: role
    using:
      foreign_key_constraint_on: default_role
array_relationships:
  - name: bookings
    using:
      foreign_key_constraint_on:
        column: user_id
        table:
          name: bookings
          schema: public
  - name: oauth2_auth_requests
    using:
      foreign_key_constraint_on:
        column: user_id
        table:
          name: oauth2_auth_requests
          schema: auth
  - name: oauth2_clients
    using:
      foreign_key_constraint_on:
        column: created_by
        table:
          name: oauth2_clients
          schema: auth
  - name: oauth2_refresh_tokens
    using:
      foreign_key_constraint_on:
        column: user_id
        table:
          name: oauth2_refresh_tokens
          schema: auth
  - name: pets
    using:
      foreign_key_constraint_on:
        column: user_id
        table:
          name: pets
          schema: public
  - name: pkce_authorization_codes
    using:
      foreign_key_constraint_on:
        column: user_id
        table:
          name: pkce_authorization_codes
          schema: auth
  - name: refreshTokens
    using:
      foreign_key_constraint_on:
        column: user_id
        table:
          name: refresh_tokens
          schema: auth
  - name: roles
    using:
      foreign_key_constraint_on:
        column: user_id
        table:
          name: user_roles
          schema: auth
  - name: userProviders
    using:
      foreign_key_constraint_on:
        column: user_id
        table:
          name: user_providers
          schema: auth
  - name: userSecurityKeys
    using:
      foreign_key_constraint_on:
        column: user_id
        table:
          name: user_security_keys
          schema: auth
